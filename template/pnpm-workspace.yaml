packages:
  - 'apps/*'
  - 'packages/*'

# Single source of truth for versions shared by the root and the apps.
# The two published submodules (nestjs-neo4jsonapi, nextjs-jsonapi) deliberately
# do NOT use catalog references: they build and publish standalone from their
# own repos, where this file does not exist. scripts/check-dep-drift.js keeps
# their concrete pins aligned with these.
catalog:
  eslint: ^9.39.5
  '@typescript-eslint/eslint-plugin': ^8.65.0
  '@typescript-eslint/parser': ^8.65.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-prettier: ^5.5.6
  ts-node: ^10.9.2
  vitest: ^4.1.10
  '@vitest/coverage-v8': ^4.1.10
  zod: ^4.4.3
  react: 19.2.8
  react-dom: 19.2.8
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4
  react-hook-form: 7.83.0
  next: 16.3.0
  # The NestJS runtime packages the api and nestjs-neo4jsonapi share. This is
  # the ONLY place the monorepo names a version: apps/api references them with
  # `catalog:` and the `overrides:` block below does too, so a bump here moves
  # the declared range AND the forced resolution together. An override carrying
  # its own literal can silently undercut the manifests' floors — pnpm
  # overrides REPLACE declared ranges rather than intersecting them.
  '@nestjs/common': ^11.1.28
  '@nestjs/core': ^11.1.28
  '@nestjs/config': ^4.0.4
  '@nestjs/platform-fastify': ^11.1.28
  '@nestjs/platform-socket.io': ^11.1.28
  '@nestjs/websockets': ^11.1.28

# pnpm 11 changed this setting's default to `install`: every `pnpm run` / `pnpm exec`
# checks whether node_modules is up to date and, if it thinks it is not, shells out to
# `pnpm install` BEFORE running the script. In a production container that is wrong in
# every way — it needs the network, it mutates an image that is supposed to be
# immutable, and (because the implicit install carries no --ignore-scripts) it runs the
# root `prepare` script with devDependencies absent ("sh: husky: not found" crash-loop).
# `warn` keeps the useful local signal while never installing implicitly.
verifyDepsBeforeRun: warn

# Missing peers must be a loud install problem, not a silent second copy.
# autoInstallPeers manufactures independent resolutions for undeclared peers,
# which is how inert duplicate library copies are born. Every workspace package
# declares its peers' devDep counterparts explicitly.
autoInstallPeers: false

overrides:
  # next is a peer of next-intl, so pnpm keys next-intl's instance by the next
  # version each workspace project resolves. When apps/web and the
  # nextjs-jsonapi submodule disagree, next-intl is installed twice and a
  # single `vi.mock("next-intl")` only patches one copy. One next → one next-intl.
  next: 'catalog:'
  react: 'catalog:'
  react-dom: 'catalog:'
  '@types/react': 'catalog:'
  '@types/react-dom': 'catalog:'
  react-hook-form: 'catalog:'
  zod: 'catalog:'
  # class-validator is part of @nestjs/common's peer-resolution key: a mismatch
  # between app and submodule spawns two @nestjs/common instances and breaks DI
  # at runtime (tests that mock services pass right through it).
  class-validator: ^0.15.1
  # Without this pin the tree can resolve two rxjs copies (verified in narr8
  # 2026-08-09 by removing it: 7.8.1 and 7.8.2 both resolved) — keep one copy.
  rxjs: ^7.8.2
  # Keep ONE @nestjs/* copy in the tree, but take the version from the catalog
  # above rather than repeating a literal here (a stale literal undercuts the
  # manifests' floors silently).
  '@nestjs/common': 'catalog:'
  '@nestjs/config': 'catalog:'
  '@nestjs/core': 'catalog:'
  '@nestjs/platform-fastify': 'catalog:'
  '@nestjs/platform-socket.io': 'catalog:'
  '@nestjs/websockets': 'catalog:'
  typescript: ^5.9.3
  # Yjs must be a single copy (two instances silently corrupt shared docs and
  # print "Yjs was already imported"). Keep this at or above apps/web's
  # declared floor.
  yjs: ^13.6.31
  validator: '>=13.15.20'
  jotai: ^2.20.2

ignoredBuiltDependencies:
  - '@tensorflow/tfjs-node'
  - canvas
  - core-js

peerDependencyRules:
  allowAny:
    - reflect-metadata
  allowedVersions:
    # nestjs-redoc 2.x is unmaintained and still peers on @nestjs/swagger ^5;
    # it works against 11 in practice. Targeted silence, NOT a blanket rule.
    'nestjs-redoc>@nestjs/swagger': '11'
    # @nestjs/bullmq 11.x still peers on bullmq ^3||^4||^5; the workspace runs
    # bullmq 6 and the wrapper works against it. Revisit when @nestjs/bullmq
    # declares 6.x support.
    '@nestjs/bullmq>bullmq': '6'

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@scarf/scarf': true
  '@swc/core': true
  bcrypt: true
  cpu-features: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  necord: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  ssh2: true
  tesseract.js: true
  unrs-resolver: true
