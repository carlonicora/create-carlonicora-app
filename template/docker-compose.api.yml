# =============================================================================
# API SERVICE - STANDALONE DOCKER COMPOSE
# =============================================================================
# Deploy API service independently on a dedicated server.
# All configuration is loaded from .env file (managed by Coolify or manually).
#
# Usage:
#   docker compose -f docker-compose.api.yml up -d
#   docker compose -f docker-compose.api.yml logs -f
#   docker compose -f docker-compose.api.yml down
#
# Required environment variables: See .env.example for full list
# Key variables: NEO4J_*, REDIS_*, S3_*, JWT_SECRET, API_PORT, API_URL
# =============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-production
      args:
        - API_PORT=${API_PORT:-3400}
    ports:
      - "${API_PORT:-3400}:${API_PORT:-3400}"
    env_file:
      - .env
    environment:
      # Ensure PORT matches API_PORT for the application
      - PORT=${API_PORT:-3400}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({host:'localhost',port:process.env.API_PORT||3400,path:'/health/ready'},(r)=>process.exit(r.statusCode===200?0:1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
